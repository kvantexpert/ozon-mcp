name: Performance catalog validation

on:
  push:
    paths:
      - "patches/marketplaces-mcp-ru/perf_endpoints.yaml"
      - "tests/test_performance_catalog_patch.py"
  pull_request:
    paths:
      - "patches/marketplaces-mcp-ru/perf_endpoints.yaml"
      - "tests/test_performance_catalog_patch.py"

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pyyaml pytest
      - run: pytest -q tests/test_performance_catalog_patch.py
